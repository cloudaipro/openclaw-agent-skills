version: 0.1.0
name: audience-profiler
title: "Audience Profiler"
description: "Market audience analysis skill for producing segmentation, persona cards, consumer psychology insights, and decision-journey recommendations."
entrypoint: src/index.js
permission_profile: read
default_mode: analysis
input_schema:
  type: object
  properties:
    user_request:
      type: string
    language:
      type: string
      enum: [zh-TW, en]
    context:
      type: object
  required: [user_request]
output_schema:
  type: object
  required: [skill, language, mode, summary, artifacts, assumptions, risks, next_actions]
