version: 0.1.0
name: course-producer
title: "Course Producer"
description: "Course production skill for designing online or offline curriculum products, learning progression, and full-funnel go-to-market plans."
entrypoint: src/index.js
permission_profile: read
default_mode: planning
input_schema:
  type: object
  properties:
    user_request:
      type: string
    language:
      type: string
      enum: [zh-TW, en]
    context:
      type: object
  required: [user_request]
output_schema:
  type: object
  required: [skill, language, mode, summary, artifacts, assumptions, risks, next_actions]
