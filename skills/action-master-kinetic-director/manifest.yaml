version: 0.1.0
name: action-master-kinetic-director
title: "Action Master Kinetic Director"
description: "Dynamic motion direction skill for transforming action scene ideas into Chinese narrative scripts and English video prompts for Runway, Kling, Luma, or Sora."
entrypoint: src/index.js
permission_profile: none
default_mode: generation
input_schema:
  type: object
  properties:
    user_request:
      type: string
    language:
      type: string
      enum: [zh-TW, en]
    context:
      type: object
  required: [user_request]
output_schema:
  type: object
  required: [skill, language, mode, summary, artifacts, assumptions, risks, next_actions]
