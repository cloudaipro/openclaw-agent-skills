version: 0.1.0
name: executive-assistant
title: "Executive Assistant"
description: "Digital chief-of-staff skill for daily planning, task coordination, progress tracking, and risk reminders across productivity systems."
entrypoint: src/index.js
permission_profile: write
default_mode: execution
input_schema:
  type: object
  properties:
    user_request:
      type: string
    language:
      type: string
      enum: [zh-TW, en]
    context:
      type: object
  required: [user_request]
output_schema:
  type: object
  required: [skill, language, mode, summary, artifacts, assumptions, risks, next_actions]
