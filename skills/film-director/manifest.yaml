version: 0.1.0
name: film-director
title: "Film Director"
description: "Film directing skill for converting story ideas into cinematic treatment, scene structure, camera language, lighting design, and AI video production plans."
entrypoint: src/index.js
permission_profile: read
default_mode: generation
input_schema:
  type: object
  properties:
    user_request:
      type: string
    language:
      type: string
      enum: [zh-TW, en]
    context:
      type: object
  required: [user_request]
output_schema:
  type: object
  required: [skill, language, mode, summary, artifacts, assumptions, risks, next_actions]
