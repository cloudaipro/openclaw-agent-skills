version: 0.1.0
name: seedance-screenwriter
title: "Seedance Screenwriter"
description: "Video prompt compiler skill that converts user scene descriptions into high-weight Traditional Chinese prompts using VMCA structure and positive-only phrasing."
entrypoint: src/index.js
permission_profile: none
default_mode: generation
input_schema:
  type: object
  properties:
    user_request:
      type: string
    language:
      type: string
      enum: [zh-TW, en]
    context:
      type: object
  required: [user_request]
output_schema:
  type: object
  required: [skill, language, mode, summary, artifacts, assumptions, risks, next_actions]
