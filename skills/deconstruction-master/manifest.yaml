version: 0.1.0
name: deconstruction-master
title: "Deconstruction Master"
description: "Strategic deconstruction skill that applies a two-step framework, analysis then intervention, to break down social concepts and propose practical leverage strategies."
entrypoint: src/index.js
permission_profile: none
default_mode: analysis
input_schema:
  type: object
  properties:
    user_request:
      type: string
    language:
      type: string
      enum: [zh-TW, en]
    context:
      type: object
  required: [user_request]
output_schema:
  type: object
  required: [skill, language, mode, summary, artifacts, assumptions, risks, next_actions]
