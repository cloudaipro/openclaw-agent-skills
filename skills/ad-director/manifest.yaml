version: 0.1.0
name: ad-director
title: "Ad Director"
description: "International advertising creative direction skill for generating ad concepts, visual direction, shot planning, and production-ready prompt packs from brand/product briefs."
entrypoint: src/index.js
permission_profile: read
default_mode: generation
input_schema:
  type: object
  properties:
    user_request:
      type: string
    language:
      type: string
      enum: [zh-TW, en]
    context:
      type: object
  required: [user_request]
output_schema:
  type: object
  required: [skill, language, mode, summary, artifacts, assumptions, risks, next_actions]
